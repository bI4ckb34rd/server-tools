name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Build
        run: bash build.sh
      - name: ShellCheck
        run: shellcheck -x dist/server-tools.sh build.sh tests/*.sh
      - name: shfmt (formatting check)
        run: shfmt -i 2 -ci -d src build.sh tests

  unit:
    name: Unit tests (policy, parsing, rollback sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: bash tests/unit.sh

  netns:
    name: Kernel integration (private netns, GRE relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables nftables
      - name: Integration test (root, isolated namespace)
        run: sudo bash tests/netns.sh

  smoke:
    name: Smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:11"
          - "debian:12"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test (no root paths)
        run: bash tests/smoke.sh
      - name: Boot as root (--status)
        run: bash dist/server-tools.sh --status --no-color
